		<!-- Modal for enlarged image with arrows -->
		<div
			class="modal fade"
			id="imageModal"
			tabindex="-1"
			aria-labelledby="imageModalLabel"
			aria-hidden="true"
		>
			<div class="modal-dialog modal-xl modal-dialog-centered">
				<div class="modal-content bg-dark">
					<div
						class="modal-body text-center p-0 position-relative"
						style="overflow: hidden"
					>
						<!-- Left arrow -->
						<button
							id="modalPrev"
							type="button"
							class="btn btn-dark position-absolute top-50 start-0 translate-middle-y"
							style="z-index: 2; font-size: 2rem; opacity: 0.7"
						>
							&#8592;
						</button>
						<!-- Image -->
						<img
							id="modalImage"
							src=""
							class="img-fluid"
							style="max-height: 90vh; object-fit: contain"
							alt="Enlarged image"
						/>
						<!-- Right arrow -->
						<button
							id="modalNext"
							type="button"
							class="btn btn-dark position-absolute top-50 end-0 translate-middle-y"
							style="z-index: 2; font-size: 2rem; opacity: 0.7"
						>
							&#8594;
						</button>
					</div>
				</div>
			</div>
